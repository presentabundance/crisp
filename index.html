<title>Crisp's Big Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 16:9 stage centered, a control strip beneath it. Single cozy evening look. */
:root{
  --bg:#2a2133; --panel:#3a2e47; --ink:#fff8ee; --muted:#cbbcd8; --accent:#ffb347; --key:#4d3d63;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
main{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* The game takes all the height it can; only a slim key-hint line sits below it on computers. */
#play{position:relative;width:min(100%,calc((100dvh - 52px) * 16 / 9));min-width:min(100%,300px);max-width:100%;display:flex;flex-direction:column;gap:10px}
#stage{width:100%;aspect-ratio:16/9;position:relative;
  border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);background:#1b1522}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hint{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;color:var(--muted);font-size:14px;line-height:1.6}
kbd{font-family:var(--font);font-size:12px;background:var(--key);color:var(--ink);border-radius:6px;padding:1px 7px;border-bottom:2px solid #2a2133}
.touch{display:none;width:100%;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch .grp{display:flex;gap:10px}
.touch button{font-family:var(--font);font-weight:600;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid #5a4870;border-radius:16px;
  min-width:64px;height:58px;padding:0 14px;touch-action:none}
.touch button:active{background:#5a4870}
.touch button[data-k="jump"]{background:#b86b1f;border-color:var(--accent)}
.touch button[data-k="cue"]{background:#2f6a8a;border-color:#6cc3ef}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){.touch{display:flex}.hint{display:none}#play{width:min(100%,calc((100dvh - 16px) * 16 / 9))}}
/* Phone held sideways: the buttons sit on the game's own floor strip, so the screen can fill the height. */
@media (pointer:coarse) and (orientation:landscape){
  .touch{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 10px 8px;pointer-events:none}
  .touch .grp{pointer-events:auto;gap:8px}
  .touch button{height:44px;min-width:54px;font-size:15px;border-radius:14px;background:rgba(42,33,51,.55);border-color:rgba(255,248,238,.35);backdrop-filter:blur(2px)}
  .touch button[data-k="jump"]{background:rgba(184,107,31,.7)}
  .touch button[data-k="cue"]{background:rgba(47,106,138,.7)}
}
/* Phone held upright: the screen is short, so the buttons go full-size underneath it. */
@media (pointer:coarse) and (orientation:portrait){
  #play{width:100%}
  .touch{gap:8px}
  .touch .grp{gap:8px;flex:2}
  .touch .grp + .grp{flex:3}
  .touch button{flex:1;min-width:0;padding:0}
}
</style>

<main>
  <div id="play">
  <div id="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Crisp's Big Day: a side-scrolling puppy raising game"></canvas></div>
  <div class="touch" id="touch">
    <div class="grp"><button data-k="left" aria-label="Walk left">◀</button><button data-k="right" aria-label="Walk right">▶</button></div>
    <div class="grp"><button data-k="bark">Bark</button><button data-k="cue">Cue</button><button data-k="jump">Jump</button></div>
  </div>
  </div>
  <div class="hint">
    <span><kbd>←</kbd> <kbd>→</kbd> walk</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>C</kbd> give a command / mark "Yes!"</span>
    <span><kbd>X</kbd> bark</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> sound</span>
  </div>
</main>

<script>
(() => {
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
const W = 960, H = 540, GROUND = 462;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cvs.width = W * DPR; cvs.height = H * DPR;
const FONT = (sz, wt = 600) => `${wt} ${sz}px Fredoka, "Trebuchet MS", system-ui, sans-serif`;
try { document.fonts && document.fonts.load(FONT(20)); } catch (e) {}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- content ---------------- */
const CMDS = {
  name:  { label: 'NAME',     say: '"Crisp!"',        pose: 'look',  how: 'Say his name once. The moment he looks up at you, mark it with "Yes!" and give a treat.' },
  sit:   { label: 'SIT',      say: '"Crisp, sit."',   pose: 'sit',   how: 'Lure a treat up and back over his nose. Mark "Yes!" the moment his bottom touches the floor.' },
  down:  { label: 'DOWN',     say: '"Down."',         pose: 'down',  how: 'Lower the treat slowly to the floor between his paws. Mark "Yes!" when his elbows touch down.' },
  leave: { label: 'LEAVE IT', say: '"Leave it."',     pose: 'leave', how: 'Close your hand over a treat. Mark "Yes!" the moment he backs away, then reward from your other hand.' },
  stay:  { label: 'STAY',     say: '"Stay."',         pose: 'sit',   how: 'Ask for a sit, take one step back, then step right back in. Mark "Yes!" while he is still sitting.' },
  come:  { label: 'COME',     say: '"Crisp, come!"',  pose: 'stand', how: 'Crouch down and sound happy. Mark "Yes!" as he reaches you. Coming back should be the best thing ever.' },
};
const LEVELS = [
  { week: 8, title: 'Coming Home', theme: 'house', len: 12600, scale: 0.98, drain: 1.25, enemy: 'vacuum', gaps: false,
    lessons: ['name', 'sit'],
    story: [
      "Crisp is home! He's 8 weeks old: white fluff, black spots on his ears, around his eyes and on his back, and a black ring at the base of his tail.",
      "Little puppies need a lot of sleep. Keep his awake time under 1 hour. Any longer and he gets overtired, and overtired puppies bite.",
      "Take him to the potty pad often, keep his water fresh, and keep a chew toy handy for those sharp puppy teeth.",
    ],
    tip: 'Puppies this age sleep around 18 to 20 hours a day. A bitey puppy is very often a tired puppy.',
    feats: [['mat', 900, 'name'], ['water', 1500], ['potty', 2100], ['bed', 2800], ['mat', 3500, 'sit'], ['gate', 4200], ['potty', 4900], ['water', 5400], ['bed', 6000], ['gate', 6700], ['potty', 7400]] },
  { week: 12, title: 'The Backyard', theme: 'yard', len: 14400, scale: 1.1, drain: 1.45, enemy: 'bee', gaps: true,
    lessons: ['down', 'leave'],
    story: [
      "Crisp is 12 weeks old. He's braver now, and his puppy teeth are extra sharp. Teething season!",
      "The yard is full of things that look like snacks. Some of them aren't safe for dogs, so he'll need to learn LEAVE IT.",
      "Watch out for the pond and the bees. A bark will make a bee back off.",
    ],
    tip: 'Redirect nipping onto a chew toy instead of hands, and end play calmly before he gets overexcited.',
    feats: [['mat', 800, 'down'], ['tunnel', 1600], ['water', 2200], ['potty', 2700], ['bed', 3300], ['mat', 4000, 'leave'], ['leave', 4700, 'sock'], ['gate', 5300], ['potty', 5900], ['bed', 6500], ['water', 7000], ['leave', 7500, 'mushroom'], ['tunnel', 8100], ['potty', 8700], ['leave', 9100, 'sock']] },
  { week: 16, title: 'Big Day at the Park', theme: 'park', len: 16350, scale: 1.22, drain: 1.65, enemy: 'squirrel', gaps: true,
    lessons: ['stay', 'come'],
    story: [
      "Crisp is 16 weeks old and it's his first trip to the park.",
      "New people, new dogs, and a lot of squirrels. Gentle hellos count as socializing. Nips do not.",
      "Learn STAY for the crosswalks and COME for when a squirrel catches his eye. Then: puppy class graduation!",
    ],
    tip: 'Keep training sessions short and happy, and practice when he is rested. A tired puppy can\'t focus.',
    feats: [['mat', 800, 'stay'], ['cross', 1600], ['water', 2200], ['potty', 2700], ['bed', 3300], ['mat', 3900, 'come'], ['recall', 4600], ['leave', 5100, 'chocolate'], ['potty', 5700], ['cross', 6200], ['bed', 6800], ['water', 7300], ['recall', 7900], ['leave', 8400, 'grapes'], ['tunnel', 9000], ['potty', 9600], ['gate', 10200]] },
];
const NIPS = { house: ['slipper', 'cord', 'hand'], yard: ['hose', 'flowers', 'hand'], park: ['sandwich', 'shoe', 'hand', 'dog', 'dog'] };
const NIPNAME = { slipper: 'slipper', cord: 'phone cord', hand: 'hand', hose: 'garden hose', flowers: 'flowers', sandwich: 'sandwich', shoe: 'shoe', dog: 'other puppy' };
const OUCH = {
  slipper: 'Chewed the slipper! He was overtired.', cord: 'Chewed the phone cord! Too tired to think.', hand: 'Ouch! Nipped a hand. Overtired puppy.',
  hose: 'Bit a hole in the hose! Sleepy puppy, bad choices.', flowers: 'Ate the tulips! Time for a nap.', sandwich: 'Stole a bite of a picnic sandwich!',
  shoe: "Chomped a stranger's shoe!", dog: 'Nipped the other pup. Too tired to play nice.' };
const ITEMS = {
  sock: { name: 'sock', bad: false, msg: 'He swallowed a sock! Uh oh.' },
  mushroom: { name: 'wild mushroom', bad: true, msg: 'He ate a wild mushroom. Some are toxic to dogs. Vet visit!' },
  chocolate: { name: 'chocolate', bad: true, msg: 'He ate chocolate. It\'s toxic to dogs. Vet visit!' },
  grapes: { name: 'grapes', bad: true, msg: 'He ate grapes. They\'re toxic to dogs. Vet visit!' },
};
const STOMP = { vacuum: 'Pounce! Vacuum switched off.', bee: 'Buzz off!', squirrel: 'The squirrel scampers away!' };

/* ---------------- audio ---------------- */
let actx = null, muted = false;
function initAudio() { if (actx) { if (actx.state === 'suspended') actx.resume(); return; } try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
function tone(f, d, type = 'sine', v = 0.05, f2 = null, delay = 0) {
  if (!actx || muted) return;
  try { const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.02); } catch (e) {}
}
const SFX = {
  jump: () => tone(380, .14, 'square', .03, 640),
  treat: () => tone(900, .08, 'triangle', .05, 1300),
  toy: () => { tone(700, .08, 'triangle', .05); tone(1050, .1, 'triangle', .05, null, .08); },
  woof: () => { tone(240, .13, 'sawtooth', .05, 130); tone(215, .12, 'sawtooth', .045, 120, .16); },
  ouch: () => tone(560, .3, 'triangle', .06, 180),
  hurt: () => tone(190, .35, 'square', .045, 70),
  good: () => { tone(660, .1, 'sine', .06); tone(880, .12, 'sine', .06, null, .1); tone(1100, .16, 'sine', .05, null, .2); },
  miss: () => tone(260, .22, 'sine', .05, 170),
  nap: () => { [523, 440, 392, 330].forEach((f, i) => tone(f, .4, 'sine', .045, null, i * .35)); },
  pee: () => tone(1200, .3, 'sine', .03, 800),
  drink: () => { for (let i = 0; i < 4; i++) tone(500 + i * 40, .06, 'sine', .04, 300, i * .1); },
};
const sfx = n => SFX[n] && SFX[n]();

/* ---------------- input ---------------- */
const keys = { left: false, right: false, jump: false };
const pressed = { jump: false, bark: false, cue: false, confirm: false };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyC: 'cue', KeyX: 'bark', KeyB: 'bark' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter' || e.code === 'ArrowDown') e.preventDefault();
  initAudio();
  if (e.repeat) return;
  if (k === 'left' || k === 'right' || k === 'jump') keys[k] = true;
  if (k === 'jump') { pressed.jump = true; pressed.confirm = true; }
  if (k === 'cue') pressed.cue = true;
  if (k === 'bark') pressed.bark = true;
  if (e.code === 'Enter') pressed.confirm = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k === 'left' || k === 'right' || k === 'jump') keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (mode === 'play' || mode === 'train') paused = true; });
cvs.addEventListener('pointerdown', e => { initAudio(); cvs.focus(); if (paused) { paused = false; return; } pressed.confirm = true; if (mode === 'train') pressed.cue = true; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    if (paused) paused = false;
    if (k in keys) keys[k] = true;
    if (k === 'jump') { pressed.jump = true; pressed.confirm = true; }
    if (k === 'cue') { pressed.cue = true; if (mode !== 'play' && mode !== 'train') pressed.confirm = true; }
    if (k === 'bark') pressed.bark = true; };
  const up = () => { if (k in keys) keys[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------------- state ---------------- */
let mode = 'title', lvIdx = 0, lv = null, P = null, cam = 0, T = 0, titleCam = 0;
let hearts = 3, score = 0, toys = 0, awake = 0, potty = 0, water = 100, checkpoint = 110;
const learned = new Set();
let stats = null, banner = null, parts = [], trainer = null, action = null, paused = false, snap = null, clearInfo = null;
function togglePause() { if (mode === 'play' || mode === 'train') paused = !paused; }
const newStats = () => ({ treats: 0, balls: 0, naps: 0, goodNaps: 0, potties: 0, accidents: 0, greets: 0, redirects: 0, ouchies: 0, leftIt: 0, ateBad: 0, meltdowns: 0, recalls: 0, lessons: [] });

function buildLevel(i) {
  const L = LEVELS[i], r = rng(4242 + i * 131);
  const lv = { L, platforms: [], items: [], enemies: [], beds: [{ x: 110, used: true }], bowls: [], pottys: [], mats: [], events: [], nips: [], gaps: [], decals: [], goal: L.len - 240 };
  for (const [k, x0, a] of L.feats) { const x = Math.round(x0 * 1.5);
    if (k === 'bed') lv.beds.push({ x, used: false });
    else if (k === 'water') lv.bowls.push({ x });
    else if (k === 'potty') lv.pottys.push({ x, cool: 0, msg: 0 });
    else if (k === 'mat') lv.mats.push({ x, cmd: a, done: false });
    else if (k === 'gate') lv.events.push({ x, kind: 'barrier', cmd: 'sit', w: 40, done: false });
    else if (k === 'tunnel') lv.events.push({ x, kind: 'barrier', cmd: 'down', w: 150, done: false });
    else if (k === 'cross') lv.events.push({ x, kind: 'barrier', cmd: 'stay', w: 30, done: false });
    else if (k === 'leave') lv.events.push({ x, kind: 'leave', cmd: 'leave', item: a, done: false });
    else if (k === 'recall') lv.events.push({ x, kind: 'recall', cmd: 'come', done: false });
  }
  const fx = L.feats.map(f => Math.round(f[1] * 1.5)).concat([110, lv.goal]);
  const blocked = (a, b) => fx.some(x => x > a - 140 && x < b + 140);
  const kinds = L.gaps ? ['plat', 'enemy', 'gap', 'nip', 'nip', 'row', 'plat', 'enemy'] : ['plat', 'enemy', 'nip', 'nip', 'row', 'plat'];
  const nipTypes = NIPS[L.theme];
  let x = 420, pi = 0;
  while (x < L.len - 450) {
    const k = kinds[Math.floor(r() * kinds.length)];
    if (k === 'plat') {
      const pw = 170 + r() * 60, two = r() < 0.55, w = two ? pw + 40 + 150 + 100 : pw + 140;
      if (blocked(x, x + w)) { x += 60; continue; }
      const y = GROUND - 95 - r() * 25;
      lv.platforms.push({ x, y, w: pw });
      for (let j = 0; j < 3; j++) lv.items.push({ type: 'treat', x: x + 30 + j * (pw - 60) / 2, y: y - 28 });
      if (two) { const x2 = x + pw + 40, y2 = y - 95; lv.platforms.push({ x: x2, y: y2, w: 150 }); lv.items.push({ type: r() < 0.5 ? 'ball' : 'toy', x: x2 + 75, y: y2 - 30 }); }
      x += w;
    } else if (k === 'enemy') {
      const span = 320 + r() * 120, w = span + 120;
      if (blocked(x, x + w)) { x += 60; continue; }
      lv.enemies.push(makeEnemy(L.enemy, x + span / 2, x, x + span));
      for (let j = 0; j < 4; j++) lv.items.push({ type: 'treat', x: x + 40 + j * (span - 80) / 3, y: GROUND - 125 });
      x += w;
    } else if (k === 'gap') {
      const gw = 110 + r() * 60, w = gw + 190;
      if (blocked(x, x + w)) { x += 60; continue; }
      lv.gaps.push({ x, w: gw });
      for (let j = 0; j < 5; j++) { const t = j / 4; lv.items.push({ type: 'treat', x: x - 30 + t * (gw + 60), y: GROUND - 60 - Math.sin(t * Math.PI) * 100 }); }
      x += w;
    } else if (k === 'nip') {
      if (blocked(x, x + 300)) { x += 60; continue; }
      lv.nips.push({ type: nipTypes[Math.floor(r() * nipTypes.length)], x: x + 70, bitten: false, greeted: false, v: pi++ });
      if (r() < 0.65) lv.items.push({ type: 'toy', x: x + 230, y: GROUND - 34 });
      x += 320;
    } else {
      if (blocked(x, x + 280)) { x += 60; continue; }
      for (let j = 0; j < 4; j++) lv.items.push({ type: 'treat', x: x + j * 55, y: GROUND - 34 });
      if (r() < 0.45) lv.items.push({ type: 'toy', x: x + 250, y: GROUND - 95 });
      x += 330;
    }
  }
  return lv;
}
function makeEnemy(type, x, x0, x1) {
  const d = { vacuum: [64, 44, 70], bee: [34, 26, 95], squirrel: [42, 32, 150] }[type];
  return { type, x, y: GROUND, x0, x1, dir: 1, w: d[0], h: d[1], spd: d[2], stun: 0, dead: false, t: Math.random() * 6, dx: 0, dy: 0 };
}

function startLevel(i, retry) {
  lvIdx = i; lv = buildLevel(i);
  if (!retry) snap = { score, learned: [...learned], toys };
  else { score = snap.score; learned.clear(); snap.learned.forEach(c => learned.add(c)); toys = snap.toys; }
  hearts = 3; awake = 5; potty = 10; water = 90; checkpoint = 110;
  stats = newStats(); parts = []; trainer = null; action = null; banner = null;
  P = { x: 150, y: GROUND, prevY: GROUND, vx: 0, vy: 0, dir: 1, onGround: true, coyote: 0, buffer: 0, inv: 0, state: 'play', napT: 0, napFrom: 0, nipT: 2, mouth: 0, barkCd: 0, sitT: 0 };
  cam = 0; mode = 'story';
}

/* ---------------- helpers ---------------- */
const S = () => lv.L.scale, HW = () => 22 * S(), PH = () => 38 * S();
function popup(text, color = '#fff8ee', x = P.x, y) {
  const n = parts.filter(p => p.k === 'text' && p.life > 1.2).length;
  parts.push({ k: 'text', text, color, x, y: (y ?? P.y - PH() - 30) - n * 22, vy: -34, life: 1.9, max: 1.9 });
}
function spark(x, y, color, n = 8) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 60 + Math.random() * 130; parts.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .6, max: .6, color }); } }
function hearty(x, y, n = 4) { for (let i = 0; i < n; i++) parts.push({ k: 'heart', x: x + (Math.random() - .5) * 30, y, vx: (Math.random() - .5) * 30, vy: -50 - Math.random() * 40, life: 1.2, max: 1.2 }); }
function setBanner(text, sub, color = '#ffb347', t = 2.6) { banner = { text, sub, color, t, max: t }; }
const overGap = x => lv.gaps.some(g => x > g.x + 6 && x < g.x + g.w - 6);
function respawnAt(x) { P.x = x; P.y = GROUND; P.prevY = GROUND; P.vx = 0; P.vy = 0; cam = clamp(P.x - W * 0.36, 0, lv.L.len - W); }

function loseHeart() { hearts--; sfx('hurt'); if (hearts <= 0) { mode = 'over'; return true; } return false; }
function hurt(fromX) {
  if (loseHeart()) return;
  P.inv = 1.6; P.vx = (P.x < fromX ? -1 : 1) * 320; P.vy = -420; popup('Yelp!', '#ff8a80');
}
function fell() { stats.ouchies += 0; if (loseHeart()) return; respawnAt(checkpoint + 50); P.inv = 1.5; popup('Splash! Back to the last bed.', '#9fd3ff'); }
function meltdown() {
  stats.meltdowns++;
  setBanner('Overtired meltdown!', 'He was awake a full hour. Back to bed for a nap.', '#ff7b72', 3);
  if (loseHeart()) return;
  respawnAt(checkpoint); P.state = 'nap'; P.napT = 2.6; P.napFrom = awake; sfx('nap');
}

/* ---------------- update ---------------- */
function update(dt) {

  if (mode === 'story') { if (pressed.confirm) { mode = 'play'; setBanner(`Week ${lv.L.week}`, lv.L.title, '#ffb347', 2); } return; }
  if (mode === 'clear') { if (pressed.confirm) { if (lvIdx + 1 < LEVELS.length) startLevel(lvIdx + 1); else mode = 'win'; } return; }
  if (mode === 'over') { if (pressed.confirm) startLevel(lvIdx, true); return; }
  if (mode === 'win') { if (pressed.confirm) { mode = 'title'; lv = null; } return; }

}
function updateEnemies(dt) {

    if (e.stun > 0) { e.stun -= dt; continue; }
    e.x += e.dir * e.spd * dt;
    if (e.x > e.x1) { e.x = e.x1; e.dir = -1; } if (e.x < e.x0) { e.x = e.x0; e.dir = 1; }
    if (e.type === 'bee') e.y = GROUND - 6 - (Math.sin(e.t * 2.3) * 0.5 + 0.5) * 95;
    else if (e.type === 'squirrel') e.y = GROUND - Math.abs(Math.sin(e.t * 5)) * 26;

}

const FUR = '#fdfcf9', FURE = '#c4bbad', FURF = '#e8e1d5', SPOT = '#1f1c22';
