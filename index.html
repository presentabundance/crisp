<title>Crisp's Big Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one 16:9 stage that takes all the height it can; controls sit on its floor strip (phone sideways) or below it. */
:root{
  --bg:#2a2133; --panel:#3a2e47; --ink:#fff8ee; --muted:#cbbcd8; --accent:#ffb347; --key:#4d3d63;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
main{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#play{position:relative;width:min(100%,calc((100dvh - 52px) * 16 / 9));min-width:min(100%,300px);max-width:100%;display:flex;flex-direction:column;gap:10px}
#stage{width:100%;aspect-ratio:16/9;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);background:#1b1522}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hint{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;color:var(--muted);font-size:14px;line-height:1.6}
kbd{font-family:var(--font);font-size:12px;background:var(--key);color:var(--ink);border-radius:6px;padding:1px 7px;border-bottom:2px solid #2a2133}
.touch{display:none;width:100%;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch .grp{display:flex;gap:10px}
.touch button{font-family:var(--font);font-weight:600;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid #5a4870;border-radius:16px;
  min-width:64px;height:58px;padding:0 14px;touch-action:none}
.touch button:active{background:#5a4870}
.touch button[data-k="jump"]{background:#b86b1f;border-color:var(--accent)}
.touch button[data-k="cue"]{background:#2f6a8a;border-color:#6cc3ef}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){.touch{display:flex}.hint{display:none}#play{width:min(100%,calc((100dvh - 16px) * 16 / 9))}}
@media (pointer:coarse) and (orientation:landscape){
  .touch{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 10px 8px;pointer-events:none}
  .touch .grp{pointer-events:auto;gap:8px}
  .touch button{height:44px;min-width:54px;font-size:15px;border-radius:14px;background:rgba(42,33,51,.55);border-color:rgba(255,248,238,.35);backdrop-filter:blur(2px)}
  .touch button[data-k="jump"]{background:rgba(184,107,31,.7)}
  .touch button[data-k="cue"]{background:rgba(47,106,138,.7)}
}
@media (pointer:coarse) and (orientation:portrait){
  #play{width:100%}
  .touch{gap:8px}
  .touch .grp{gap:8px;flex:2}
  .touch .grp + .grp{flex:3}
  .touch button{flex:1;min-width:0;padding:0}
}
</style>

<main>
  <div id="play">
  <div id="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Crisp's Big Day: a puppy raising game"></canvas></div>
  <div class="touch" id="touch">
    <div class="grp"><button data-k="left" aria-label="Walk left">◀</button><button data-k="right" aria-label="Walk right">▶</button></div>
    <div class="grp"><button data-k="bark">Bark</button><button data-k="cue">Cue</button><button data-k="jump">Jump</button></div>
  </div>
  </div>
  <div class="hint">
    <span><kbd>←</kbd> <kbd>→</kbd> walk</span>
    <span><kbd>Space</kbd> jump / hold to move the treat</span>
    <span><kbd>C</kbd> command / mark "Yes!"</span>
    <span><kbd>X</kbd> bark</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> sound</span>
  </div>
</main>

<script>
(() => {
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
const W = 960, H = 540, GROUND = 462;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cvs.width = W * DPR; cvs.height = H * DPR;
const FONT = (sz, wt = 600) => `${wt} ${sz}px Fredoka, "Trebuchet MS", system-ui, sans-serif`;
const HAND = sz => `${sz}px "Patrick Hand", "Comic Sans MS", cursive`;
try { document.fonts && (document.fonts.load(FONT(20)), document.fonts.load(HAND(20))); } catch (e) {}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TOUCH = (() => { try { return matchMedia('(pointer:coarse)').matches; } catch (e) { return false; } })();
const KEY = TOUCH ? { jump: 'Jump', cue: 'Cue', left: '◀', right: '▶' } : { jump: 'Space', cue: 'C', left: '←', right: '→' };

/* ================= content ================= */
const CMDS = {
  name:  { label: 'NAME',     say: '"Crisp!"' },
  sit:   { label: 'SIT',      say: '"Crisp, sit."' },
  down:  { label: 'DOWN',     say: '"Down."' },
  leave: { label: 'LEAVE IT', say: '"Leave it."' },
  stay:  { label: 'STAY',     say: '"Stay."' },
  come:  { label: 'COME',     say: '"Crisp, come!"' },
};
const CMD_ORDER = ['name', 'sit', 'down', 'leave', 'stay', 'come'];
const LESSON = {
  name:  { tip: 'Say his name once. The moment he looks at you, mark it and reward.',
           ctl: () => `Watch his nose. Tap ${KEY.cue} to say "Crisp!" once, when he's only lightly sniffing. When he looks up, tap ${KEY.cue} again to mark "Yes!"` },
  sit:   { tip: 'Lure the treat slowly up and back over his head. His bottom drops on its own.',
           ctl: () => `Hold ${KEY.jump} in short bursts to move the treat. Keep the scent line green. Tap ${KEY.cue} the moment his bottom touches the floor.` },
  down:  { tip: 'Lower the treat slowly to the floor between his paws, then wait for his elbows.',
           ctl: () => `Hold ${KEY.jump} in short bursts to lower the treat. Then hold still. Tap ${KEY.cue} the moment he lies all the way down.` },
  leave: { tip: 'Keep the treat in a closed fist. Reward only when he chooses to back off.',
           ctl: () => `Do nothing while he paws and licks. Tap ${KEY.cue} the moment he backs away from your hand.` },
  stay:  { tip: 'Add distance and time a little at a time. Go back to him to reward.',
           ctl: () => `Hold ${KEY.right} to step back, then stand still. Hold ${KEY.left} to walk back. Tap ${KEY.cue} beside him before he breaks.` },
  come:  { tip: "Call once, then be the most exciting thing around. Never chase him.",
           ctl: () => `Tap ${KEY.cue} once to call him. Hold ${KEY.right} to run away (he'll chase you) or ${KEY.jump} to crouch and clap. Tap ${KEY.cue} when he reaches you.` },
};
const DAYS = [
  { day: 1, week: 8, theme: 'house', title: 'Coming Home', scale: 0.98, drain: 0.75, enemy: 'vacuum', gaps: false, len: 7000,
    story: ["Crisp is home! He's 8 weeks old: white fluff, black spots on his ears, around his eyes and on his back, and a black ring at the base of his tail.",
            "Everything is new. Keep his awake time under an hour, get him to the potty pad often, and teach him his name. Anything that happens today stays happened."],
    feats: [['lesson', 800, 'name'], ['water', 1500], ['potty', 2200], ['bed', 3100], ['potty', 4000], ['water', 4800], ['potty', 5700]] },
  { day: 2, week: 8, theme: 'house', title: 'First Real Lesson', scale: 0.98, drain: 0.75, enemy: 'vacuum', gaps: false, len: 7200,
    story: ["Day two. Crisp is figuring out where he sleeps, where he potties, and that hands are not chew toys.",
            "Today he learns SIT. Sitting politely is how he'll get through the pet gates."],
    feats: [['practice', 700, 'name'], ['lesson', 1400, 'sit'], ['potty', 2100], ['gate', 2800], ['bed', 3500], ['water', 4200], ['gate', 4900], ['potty', 5600], ['practice', 6300, 'sit']] },
  { day: 3, week: 12, theme: 'yard', title: 'Into the Backyard', scale: 1.1, drain: 0.85, enemy: 'bee', gaps: true, len: 7600,
    story: ["Crisp is 12 weeks old and allowed in the backyard. Grass for potty! A pond for trouble.",
            "Today he learns DOWN, which gets him through the tunnel under the hedge. Bark at bees to make them back off."],
    feats: [['lesson', 800, 'down'], ['tunnel', 1600], ['water', 2300], ['potty', 2900], ['bed', 3700], ['practice', 4400, 'sit'], ['gate', 5100], ['tunnel', 5800], ['potty', 6600]] },
  { day: 4, week: 12, theme: 'yard', title: 'Teething Season', scale: 1.1, drain: 0.85, enemy: 'bee', gaps: true, len: 7600,
    story: ["His adult teeth are coming in and everything looks chewable, including things that could make him sick.",
            "Today he learns LEAVE IT. If he grabs something bad, there's no taking it back."],
    feats: [['lesson', 800, 'leave'], ['leave', 1600, 'sock'], ['water', 2300], ['potty', 2900], ['bed', 3700], ['leave', 4400, 'mushroom'], ['tunnel', 5000], ['practice', 5700, 'down'], ['potty', 6400], ['leave', 6950, 'sock']] },
  { day: 5, week: 16, theme: 'park', title: 'First Trip to the Park', scale: 1.22, drain: 0.95, enemy: 'squirrel', gaps: true, len: 8000,
    story: ["Crisp is 16 weeks old. His window for getting comfortable with new people and dogs is closing soon.",
            "Say hello to everyone you can while he's rested. Today he learns STAY, for the crosswalks."],
    feats: [['lesson', 800, 'stay'], ['cross', 1600], ['water', 2300], ['potty', 2900], ['bed', 3700], ['leave', 4400, 'chocolate'], ['cross', 5100], ['practice', 5800, 'leave'], ['potty', 6500], ['gate', 7200]] },
  { day: 6, week: 16, theme: 'park', title: 'Graduation Day', scale: 1.22, drain: 0.95, enemy: 'squirrel', gaps: true, len: 8000,
    story: ["The last day of puppy class. Today he learns COME, the command that keeps him safe off-leash.",
            "Squirrels are everywhere. Then it's graduation at the end of the path."],
    feats: [['lesson', 800, 'come'], ['recall', 1700], ['water', 2300], ['potty', 2900], ['bed', 3700], ['leave', 4400, 'grapes'], ['recall', 5100], ['cross', 5700], ['tunnel', 6400], ['potty', 7000], ['practice', 7500, 'stay']] },
];
const NIPS = { house: ['slipper', 'cord', 'hand', 'hand'], yard: ['hose', 'flowers', 'hand'], park: ['sandwich', 'shoe', 'hand', 'hand', 'dog', 'dog'] };
const NIPNAME = { slipper: 'slipper', cord: 'phone cord', hand: 'hand', hose: 'garden hose', flowers: 'flowers', sandwich: 'sandwich', shoe: 'shoe', dog: 'other puppy' };
const OUCH = { slipper: 'Chewed the slipper. He was overtired.', cord: 'Chewed the phone cord. Too tired to think.', hand: 'Ouch! He nipped a hand.',
  hose: 'Bit a hole in the hose.', flowers: 'Ate the tulips.', sandwich: 'Stole a bite of a picnic sandwich!', shoe: "Chomped a stranger's shoe!", dog: 'Nipped the other pup.' };
const ITEMS = {
  sock: { name: 'sock', vet: false, msg: 'He swallowed a sock. Upset tummy all day.' },
  mushroom: { name: 'wild mushroom', vet: true, msg: 'He ate a wild mushroom. Some are toxic to dogs.' },
  chocolate: { name: 'chocolate', vet: true, msg: "He ate chocolate. It's toxic to dogs." },
  grapes: { name: 'grapes', vet: true, msg: "He ate grapes. They're toxic to dogs." },
};
const SNAPCAP = {
  home: ['Coming home', '8 weeks old and tiny.'], 'first-nap': ['First nap', 'Out like a light in his own bed.'],
  'first-name': ['He knows his name!', 'Looked right at me when I said "Crisp."'], 'first-sit': ['First sit!', 'Bottom on the floor. Good boy!'],
  'first-down': ['First down!', 'Elbows on the floor. A real down!'], 'first-leave': ['First "leave it"', 'He backed off the treat all by himself.'],
  'first-stay': ['First stay!', 'He held it while I stepped away.'], 'first-come': ['First recall!', 'He came running, ears flying.'],
  'first-potty': ['Potty win', 'Went in the right spot!'], 'first-hello': ['A new friend', 'So gentle when he says hello.'], 'first-dog': ['Puppy pal', 'His first dog friend.'],
  accident: ['Oops', 'First accident on the floor.'], nip: ['Too tired', 'He nipped a hand. Nap time, little guy.'], vacuum: ['The vacuum monster', 'Now he hides from it.'],
  pond: ['Pond plunge', 'Soaked. Towel time.'], bee: ['Bee sting', 'Poor paw. He limped for a while.'], meltdown: ['Meltdown', 'Overtired. Crashed on the floor.'],
  vet: ['Vet visit', 'A scary day. He was so brave.'], week12: ['12 weeks old', 'Bigger, braver, and teething.'], week16: ['16 weeks old', 'First trip to the park!'],
  graduation: ['Graduate!', 'Puppy class, done.'],
};

/* ================= audio ================= */
let actx = null, muted = false;
function initAudio() { if (actx) { if (actx.state === 'suspended') actx.resume(); return; } try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
function tone(f, d, type = 'sine', v = 0.05, f2 = null, delay = 0) {
  if (!actx || muted) return;
  try { const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.02); } catch (e) {}
}
const SFX = {
  jump: () => tone(380, .14, 'square', .03, 640), treat: () => tone(900, .08, 'triangle', .05, 1300),
  toy: () => { tone(700, .08, 'triangle', .05); tone(1050, .1, 'triangle', .05, null, .08); },
  woof: () => { tone(240, .13, 'sawtooth', .05, 130); tone(215, .12, 'sawtooth', .045, 120, .16); },
  ouch: () => tone(560, .3, 'triangle', .06, 180), hurt: () => tone(190, .35, 'square', .045, 70),
  good: () => { tone(660, .1, 'sine', .06); tone(880, .12, 'sine', .06, null, .1); tone(1100, .16, 'sine', .05, null, .2); },
  miss: () => tone(260, .22, 'sine', .05, 170), say: () => tone(520, .12, 'triangle', .04, 640),
  nap: () => { [523, 440, 392, 330].forEach((f, i) => tone(f, .4, 'sine', .045, null, i * .35)); },
  pee: () => tone(1200, .3, 'sine', .03, 800), drink: () => { for (let i = 0; i < 4; i++) tone(500 + i * 40, .06, 'sine', .04, 300, i * .1); },
  snap: () => { tone(1800, .05, 'square', .03); tone(900, .08, 'square', .02, null, .05); },
  splash: () => { for (let i = 0; i < 5; i++) tone(300 + Math.random() * 600, .1, 'sine', .03, 150, i * .04); },
};
const sfx = n => SFX[n] && SFX[n]();

/* ================= input ================= */
const keys = { left: false, right: false, jump: false };
const pressed = { jump: false, bark: false, cue: false, confirm: false };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyC: 'cue', KeyX: 'bark', KeyB: 'bark' };
let uiButtons = [];
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter' || e.code === 'ArrowDown') e.preventDefault();
  initAudio();
  if (e.repeat) return;
  if (k === 'left' || k === 'right' || k === 'jump') keys[k] = true;
  if (k === 'jump') { pressed.jump = true; pressed.confirm = true; }
  if (k === 'cue') pressed.cue = true;
  if (k === 'bark') pressed.bark = true;
  if (e.code === 'Enter') pressed.confirm = true;
  if (e.code === 'KeyP' || e.code === 'Escape') { if (mode === 'album') closeAlbum(); else togglePause(); }
  if (e.code === 'KeyM') muted = !muted;
  if (mode === 'album') { if (e.code === 'ArrowLeft') albumPage = Math.max(0, albumPage - 1); if (e.code === 'ArrowRight') albumPage = Math.min(albumPages() - 1, albumPage + 1); }
  if ((mode === 'title' || mode === 'ending') && e.code === 'KeyA' && snaps.length) openAlbum();
  if ((mode === 'title' || mode === 'ending') && e.code === 'KeyN') askNew();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k === 'left' || k === 'right' || k === 'jump') keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (mode === 'play' || mode === 'lesson') paused = true; });
cvs.addEventListener('pointerdown', e => {
  initAudio(); cvs.focus();
  if (paused) { paused = false; return; }
  const r = cvs.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const b of uiButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (mode === 'album') { if (x < W / 2) albumPage = Math.max(0, albumPage - 1); else albumPage = Math.min(albumPages() - 1, albumPage + 1); return; }
  pressed.confirm = true; if (mode === 'lesson') pressed.cue = true;
});
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    if (paused) paused = false;
    if (k in keys) keys[k] = true;
    if (k === 'jump') { pressed.jump = true; if (mode !== 'lesson') pressed.confirm = true; }
    if (k === 'cue') { pressed.cue = true; if (mode !== 'play' && mode !== 'lesson') pressed.confirm = true; }
    if (k === 'bark') pressed.bark = true;
    if (mode === 'album') { if (k === 'left') albumPage = Math.max(0, albumPage - 1); if (k === 'right') albumPage = Math.min(albumPages() - 1, albumPage + 1); } };
  const up = () => { if (k in keys) keys[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ================= state ================= */
let mode = 'title', dayIdx = 0, lv = null, P = null, cam = 0, T = 0, titleCam = 0, paused = false;
let awake = 0, potty = 0, water = 100, checkpoint = 110, treats = 10, toys = 0;
let rel = {}, known = new Set(), traits = null, snaps = [], stage = 'intro', complete = false, sickToday = false;
let dayStats = null, dayLog = [], dayEnd = null, banner = null, parts = [], action = null, Ls = null, saveT = 0, flash = 0, snapShow = null;
let layoutF = 1.4, albumPage = 0, albumReturn = 'title', saved = null, confirmReturn = 'title';
const freshTraits = () => ({ bite: 0, fearVac: 0, fearWater: 0, vet: 0, stung: 0, greetsP: 0, greetsD: 0, accidents: 0, potties: 0, meltdowns: 0, naps: 0, goodNaps: 0, redirects: 0, ouchies: 0, recalls: 0, sickNext: false });
const freshDayStats = () => ({ naps: 0, goodNaps: 0, potties: 0, accidents: 0, greets: 0, redirects: 0, ouchies: 0, meltdowns: 0, recalls: 0, cues: 0, cueFails: 0 });
function newPuppy() {
  layoutF = 1.4; dayIdx = 0; rel = {}; CMD_ORDER.forEach(c => rel[c] = 0); known = new Set(); traits = freshTraits(); snaps = []; treats = 10; toys = 0;
  complete = false; stage = 'intro'; sickToday = false; dayLog = []; dayStats = freshDayStats(); lv = null;
}
function togglePause() { if (mode === 'play' || mode === 'lesson') paused = !paused; }

/* ---- saving: one puppyhood, saved as you go ---- */
const SAVE_KEY = 'crisp-puppyhood-v2';
function serialize() {
  const s = { v: 2, layoutF, dayIdx, rel, known: [...known], traits, snaps, treats, toys, stage, complete, sickToday, dayStats, dayLog, dayEnd, inDay: null };
  if (stage === 'day' && lv && P) s.inDay = {
    x: P.x, awake, potty, water, checkpoint, slowT: P.slowT || 0,
    got: lv.items.map(i => i.got ? 1 : 0), ev: lv.events.map(e => e.done ? 1 : 0), mats: lv.mats.map(m => m.done ? 1 : 0),
    beds: lv.beds.map(b => b.used ? 1 : 0), nips: lv.nips.map(n => (n.bitten ? 1 : 0) | (n.greeted ? 2 : 0) | (n.ouch ? 4 : 0)),
    en: lv.enemies.map(e => e.dead ? 1 : 0), decals: lv.decals.map(d => d.x) };
  return s;
}
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function applySave(s) {
  layoutF = s.layoutF || 1; dayIdx = s.dayIdx; rel = s.rel; known = new Set(s.known); traits = Object.assign(freshTraits(), s.traits); snaps = s.snaps || [];
  treats = s.treats; toys = s.toys; stage = s.stage; complete = s.complete; sickToday = s.sickToday; dayStats = s.dayStats || freshDayStats(); dayLog = s.dayLog || []; dayEnd = s.dayEnd;
  if (stage === 'day' && s.inDay) {
    const d = s.inDay; buildDay(dayIdx);
    awake = d.awake; potty = d.potty; water = d.water; checkpoint = d.checkpoint;
    d.got.forEach((v, i) => lv.items[i] && (lv.items[i].got = !!v)); d.ev.forEach((v, i) => lv.events[i] && (lv.events[i].done = !!v));
    d.mats.forEach((v, i) => lv.mats[i] && (lv.mats[i].done = !!v)); d.beds.forEach((v, i) => lv.beds[i] && (lv.beds[i].used = !!v));

      if (two) { const x2 = x + pw + 40, y2 = y - 95; lv.platforms.push({ x: x2, y: y2, w: 140 }); lv.items.push({ type: 'toy', x: x2 + 70, y: y2 - 30 }); }

      if (r() < 0.6) lv.items.push({ type: 'toy', x: x + 210, y: GROUND - 34 });

  cam = lerp(cam, clamp(P.x - W * 0.36, 0, lv.len - W), Math.min(1, dt * 6));

/* ================= lessons: real technique ================= */

function updateLesson(dt) {
